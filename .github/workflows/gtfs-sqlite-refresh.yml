name: GTFS SQLite Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build GTFS SQLite
        env:
          GTFS_VERSION: ${{ github.run_number }}-${{ github.run_attempt }}
          GTFS_RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/gtfs-data
        run: npm run gtfs:build-sqlite

      - name: Verify GTFS SQLite
        run: npm run gtfs:verify-sqlite

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gtfs-data
          name: GTFS Data
          draft: false
          prerelease: false
          make_latest: false
          overwrite_files: true
          # The builder omits the week artifact when the feed's horizon ends
          # before the trailing week window (zero trips); without this, the
          # unmatched week glob fails the publish even though build+verify pass.
          fail_on_unmatched_files: false
          files: |
            dist/gtfs/go-gtfs-core.sqlite
            dist/gtfs/go-gtfs-month.sqlite
            dist/gtfs/go-gtfs-week-*.sqlite
            dist/gtfs/manifest.json
